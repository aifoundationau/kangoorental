    <section class="section">
      <div class="container narrow">
        <form class="card form-card" id="loginForm" novalidate>
          <h1>Log in</h1>
          <div class="google-block" data-google>
            <a href="/api/auth/google/start" id="googleOAuthBtn" class="btn-google-full" data-testid="google-oauth-btn" data-agent-id="google-oauth-btn">
              <svg class="google-g-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
                <path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/>
                <path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 0 0 0 10.76l3.98-3.09z"/>
                <path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0c-4.69 0-8.74 2.7-10.71 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
              </svg>
              <span>Continue with Google</span>
            </a>
            <p class="divider"><span>or</span></p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="form-error" id="loginError" role="alert" hidden></p>
          <button class="btn btn-block" type="submit" id="loginBtn">Log in</button>
          <p class="center hint">New here? <a href="/register">Create an account</a></p>
          <p class="center hint">Forgotten your password? Contact us and our team will help you reset it.</p>
        </form>
      </div>
    </section>
